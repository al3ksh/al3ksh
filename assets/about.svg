<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="I write apps. Sometimes they work. Sometimes they don't.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 24px; fill: #e6edf3; white-space: pre; }
  .p { fill: #8b949e; } .f { fill: #6e7681; } .ok { fill: #3fb950; } .no { fill: #f85149; } .dot { fill: #30363d; }
  @media (prefers-color-scheme: light) {
    text { fill: #1f2328; } .p { fill: #59636e; } .f { fill: #8c959f; }
    .ok { fill: #1a7f37; } .no { fill: #cf222e; } .dot { fill: #d0d7de; }
  }
</style>
<defs><pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" class="dot"/></pattern></defs><rect x="898.5" y="48.5" width="264" height="198" fill="url(#d)"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.030;0.040;0.95;1" dur="10s" repeatCount="indefinite"/><text x="40" y="60"><tspan class="p">~ $</tspan> ./al3ksh --about</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.130;0.140;0.95;1" dur="10s" repeatCount="indefinite"/><text x="40" y="105">  I write apps.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.230;0.240;0.95;1" dur="10s" repeatCount="indefinite"/><text x="40" y="145">  <tspan class="ok">[ ok ]</tspan> sometimes they work.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.330;0.340;0.95;1" dur="10s" repeatCount="indefinite"/><text x="40" y="185">  <tspan class="no">[fail]</tspan> <tspan class="f">sometimes they don't.</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.430;0.440;0.95;1" dur="10s" repeatCount="indefinite"/><text x="40" y="230"><tspan class="p">~ $</tspan> <tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text></g>
</svg>
