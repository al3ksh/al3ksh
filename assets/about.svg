<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-label="I write apps. Sometimes they work. Sometimes they don't.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; fill: #e6edf3; white-space: pre; }
  .p { fill: #8b949e; } .f { fill: #6e7681; } .ok { fill: #3fb950; } .no { fill: #f85149; }
  @media (prefers-color-scheme: light) {
    text { fill: #1f2328; } .p { fill: #59636e; } .f { fill: #8c959f; }
    .ok { fill: #1a7f37; } .no { fill: #cf222e; }
  }
</style>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.030;0.040;0.95;1" dur="10s" repeatCount="indefinite"/><text x="8" y="28"><tspan class="p">~ $</tspan> ./al3ksh --about</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.130;0.140;0.95;1" dur="10s" repeatCount="indefinite"/><text x="8" y="62">  I write apps.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.230;0.240;0.95;1" dur="10s" repeatCount="indefinite"/><text x="8" y="90">  <tspan class="ok">[ ok ]</tspan> sometimes they work.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.330;0.340;0.95;1" dur="10s" repeatCount="indefinite"/><text x="8" y="118">  <tspan class="no">[fail]</tspan> <tspan class="f">sometimes they don't.</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.430;0.440;0.95;1" dur="10s" repeatCount="indefinite"/><text x="8" y="152"><tspan class="p">~ $</tspan> <tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text></g>
</svg>
